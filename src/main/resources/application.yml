spring:
  application:
    name: pricewatch
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

pricewatch:
  parser:
    timeout-ms: ${PRICE_PARSER_TIMEOUT:10000}
  scheduler:
    fixed-delay: ${PRICE_CHECK_INTERVAL:60000}
